services:
  - type: web
    name: prepkit-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_TTL_DAYS
        value: 7
      - key: GENERATION_CONCURRENCY
        value: 2
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_REQUESTS_PER_MINUTE
        value: 10
      - key: LLM_TOKENS_PER_MINUTE
        value: 200000
      - key: LLM_CONCURRENCY
        value: 2
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: BRAVE_API_KEY
        sync: false
