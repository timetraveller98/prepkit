services:
  - type: web
    name: prepkit-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Must be set to the SAME value as the web app's API_JWT_SECRET, so the
      # API can verify the token the web server signs. Set by hand rather than
      # generated, because both sides have to agree on it.
      - key: JWT_SECRET
        sync: false
      - key: SESSION_TTL_DAYS
        value: 7
      - key: GENERATION_CONCURRENCY
        value: 2
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.6-flash
      # Gemini's free tier allows 5 generate_content requests per minute. The
      # client throttles to this before sending rather than waiting to be told.
      # Raise it to match your tier if you have a higher one.
      - key: LLM_REQUESTS_PER_MINUTE
        value: 5
      - key: LLM_TOKENS_PER_MINUTE
        value: 200000
      - key: LLM_CONCURRENCY
        value: 2
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

# ALLOW_PRIVATE_URLS is deliberately absent: leaving it unset is what keeps the
# private-address block on in production.
